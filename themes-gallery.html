<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1f2329; --muted:#6b7280; --line:#e6e8eb; --chip:#eef1f5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .screen{padding:14px;min-height:150px;display:flex;align-items:center;justify-content:center}
  .panel{width:100%;border-radius:10px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .t{font-size:15px;font-weight:700;margin-bottom:6px}
  .b{font-size:12px;opacity:.78;margin-bottom:12px}
  .btn{display:inline-block;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px}
  .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
  .ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ttl .zh{font-size:16px;font-weight:700}
  .ttl .en{font-size:12px;color:var(--muted)}
  .ttl .id{font-size:11px;color:#9aa1ab;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-left:auto}
  .desc{font-size:13px;color:#374151}
  .chips{display:flex;flex-wrap:wrap;gap:6px}

  .dl a.primary{background:#2756c9;color:#fff;border-color:#2756c9}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
</style>
</head>

const GH_RAW = "https://raw.githubusercontent.com/ConardLi/garden-skills/main/skills/web-video-presentation/themes";
const GH_TREE = "https://github.com/ConardLi/garden-skills/tree/main/skills/web-video-presentation/themes";

function lum(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||"");
  if(!m) return 0.5;
  const f = c => parseInt(c,16)/255;
  const [r,g,b] = [f(m[1]),f(m[2]),f(m[3])];
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function onAccent(a){ return lum(a) > 0.55 ? "#111" : "#fff"; }

function card(t){
  const ac = onAccent(t.accent);
  const chips = (arr,cls)=> (arr||[]).map(x=>`<span class="chip">${x}</span>`).join("");
  return `<div class="card" data-search="${(t.name+' '+t.nameZh+' '+t.id+' '+(t.mood||[]).join(' ')+' '+(t.bestFor||[]).join(' ')).toLowerCase()}">
    <div class="screen" style="background:${t.shell}">
      <div class="panel" style="background:${t.surface}">
        <div class="t" style="color:${t.text}">${t.nameZh||t.name}</div>
        <div class="b" style="color:${t.text}">${t.descriptionZh||''}</div>
        <span class="btn" style="background:${t.accent};color:${ac}">开始演示</span>
      </div>
    </div>
    <div class="meta">
      <div class="ttl"><span class="zh">${t.nameZh||''}</span><span class="en">${t.name||''}</span><span class="id">${t.id}</span></div>
      <div class="desc">${t.descriptionZh||t.description||''}</div>
      ${ (t.mood&&t.mood.length)?`<div class="lbl">气质</div><div class="chips">${chips(t.mood)}</div>`:'' }
      ${ (t.bestFor&&t.bestFor.length)?`<div class="lbl">适合场景</div><div class="chips">${chips(t.bestFor)}</div>`:'' }
      <div class="dl">
        <a class="primary" href="${GH_TREE}/${t.id}" target="_blank" rel="noopener">官网主题页</a>
        <a href="${GH_RAW}/${t.id}/theme.json" target="_blank" rel="noopener">theme.json</a>
        <a href="${GH_RAW}/${t.id}/tokens.css" target="_blank" rel="noopener">tokens.css</a>
      </div>
    </div>
  </div>`;
}

const grid = document.getElementById('grid');
function render(list){
  grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">没有匹配的主题</div>';
  document.getElementById('shown').textContent = '显示 '+list.length+' / '+THEMES.length;
}
document.getElementById('total').textContent = THEMES.length;
const q = document.getElementById('q');
q.addEventListener('input', ()=>{
  const v = q.value.trim().toLowerCase();
  render(THEMES.filter(t => (t._s||(t._s=(t.name+' '+t.nameZh+' '+t.id+' '+(t.mood||[]).join(' ')+' '+(t.bestFor||[]).join(' ')).toLowerCase())).includes(v)));
});
render(THEMES);
</script>
</body>
